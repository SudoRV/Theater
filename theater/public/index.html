<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Primary SEO -->
    <title>Synema – Watch Movies Together in Perfect Sync</title>
    <meta
      name="description"
      content="Synema lets you watch movies and videos together in perfect sync. Create a room, invite friends, chat and enjoy a shared movie night online."
    />
    <meta
      name="keywords"
      content="watch movies together, watch party, synced video playback, movie night online, group streaming, synchronized video player, watch together app"
    />
    <meta name="author" content="Theater" />
    <meta name="robots" content="index, follow" />

    <!-- Theme / PWA -->
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Open Graph (Google / Facebook / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Theater – Watch Movies Together in Sync"
    />
    <meta
      property="og:description"
      content="Host a watch party and enjoy movies together with synchronized playback, live chat, and voice."
    />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />
    <meta property="og:url" content="https://your-domain.com" />
    <meta property="og:site_name" content="Theater" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Theater – Watch Movies Together"
    />
    <meta
      name="twitter:description"
      content="Create a room, invite friends, and watch movies together in perfect sync."
    />
    <meta name="twitter:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Canonical -->
    <link rel="canonical" href="https://your-domain.com" />
  </head>

  <body>
    <noscript>
      <strong>
        Theater requires JavaScript to watch videos together in sync.
        Please enable JavaScript to continue.
      </strong>
    </noscript>

    <div id="root" style="height: 100%"></div>
  </body>
</html>
